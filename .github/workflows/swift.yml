name: Swift

on:
  push

jobs:

  apple-platforms-build:
    runs-on: mobile
    steps:
    - uses: actions/checkout@v4
    - name: "Build"
      run: swift package clean; swift build
    - name: "Run tests"
      run: swift test

  android-build:
    strategy:
      fail-fast: false
    runs-on: mobile
    timeout-minutes: 10
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4
      - name: "Build for Android"
        uses: skiptools/swift-android-action@main
        with:
          build-tests: true
          run-tests: true
