name: Swift

on:
  push

jobs:

  macos-build:
    runs-on: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift package clean; swift build
      - name: Run tests
        run: swift test

  ios-build:
    runs-on: mobile
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: set -o pipefail && xcodebuild test -scheme BSWFoundation -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' | xcbeautify --renderer github-actions

  android-build:
    runs-on: mobile
    steps:
      - uses: actions/checkout@v4
      - name: List Available AVDs
        run: |
          echo "Listing available AVDs..."
          ~/Library/Android/sdk/emulator/emulator -list-avds
      - name: Launch Emulator
        id: launch_emulator
        run: |
          echo "Launching the first available emulator..."
          AVD_NAME=$(~/Library/Android/sdk/emulator/emulator -list-avds | head -n 1)
          if [ -z "$AVD_NAME" ]; then
            echo "No AVDs found. Exiting."
            exit 1
          fi
          echo "Launching $AVD_NAME"
          nohup ~/Library/Android/sdk/emulator/emulator -avd "$AVD_NAME" -no-snapshot-load -no-audio -no-window &
      - name: Wait for Emulator to Boot
        run: |
          echo "Waiting for emulator to boot..."
          boot_completed=false
          for i in {1..30}; do
            if adb shell getprop sys.boot_completed | grep -q "1"; then
              echo "Emulator booted!"
              boot_completed=true
              break
            fi
            echo "Still waiting for emulator to boot..."
            sleep 10
          done
          if [ "$boot_completed" = false ]; then
            echo "Emulator did not boot in time. Exiting."
            exit 1
          fi
      - name: Run tests on Android
        run: SKIP_ENABLED=1 skip android test

  wasm-build:
    # GitHub-hosted: the self-hosted `mobile` runners don't have the WebAssembly Swift SDK.
    # The official Swift image provides the toolchain; we then install the matching wasm SDK,
    # compile the package for WebAssembly, and run the (wasm-eligible) unit tests in Node.
    runs-on: ubuntu-latest
    container: swift:6.3.3
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift SDK for WebAssembly
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.3.3-release/wasm-sdk/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum cabfa08b73bb8ac783927ecd15fa386e99d0c139c5f232445067bcf58379cae7
      - name: Build for WebAssembly
        run: swift build --swift-sdk swift-6.3.3-RELEASE_wasm
      - name: Install Node.js (for the wasm test runner)
        run: apt-get update && apt-get install -y nodejs npm
      - name: Install the WASI shim
        run: npm install @bjorn3/browser_wasi_shim@0.3.0
      - name: Run unit tests on WebAssembly (Node)
        run: |
          swift package --swift-sdk swift-6.3.3-RELEASE_wasm --disable-sandbox \
            js test --prelude .github/wasm-prelude.js
