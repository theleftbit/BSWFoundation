name: Swift

on:
  push

jobs:

  apple-platforms-build:
    runs-on: ios
    steps:
    - uses: actions/checkout@v4
    - name: "Build"
      run: swift package clean; swift build
    - name: "Run tests"
      run: swift test

  android-build:
    runs-on: ubuntu-latest
    container:
      image: swift:6.0-jammy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: "Build for Android"
        uses: skiptools/swift-android-action@v2
        with:
          build-tests: true
          run-tests: true
